<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jana — Hyderabad to Hamburg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --saffron:#ff8f1c; --india-green:#0f9d58; --chakra:#1a4fd6;
  --de-red:#e3342f; --de-gold:#ffce00;
  --bg:#090b10; --bg2:#111522; --panel:#161c2d; --line:#232c42;
  --ink:#eef1f8; --dim:#8f9ab5; --ok:#3ddc97; --bad:#ff6b6b;
  --grad:linear-gradient(120deg,var(--saffron),var(--de-gold) 45%,var(--india-green));
  --cyan:#00d2ff; --purple:#9d4edd;
}
@media (prefers-color-scheme:light){
  :root{--bg:#fbf7f0;--bg2:#fff;--panel:#fff;--line:#e8e2d6;--ink:#1a1d26;
        --dim:#6d7488;--ok:#0b8a5a;--bad:#c8382f;--cyan:#0077b6;--purple:#7b2cbf;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font-family:Outfit,ui-sans-serif,system-ui,sans-serif;
     min-height:100vh;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;
  background:radial-gradient(circle at 12% 18%,var(--saffron),transparent 42%),
             radial-gradient(circle at 88% 78%,var(--chakra),transparent 42%)}

header{display:flex;align-items:center;gap:16px;padding:14px 22px;
       border-bottom:1px solid var(--line);background:var(--bg2);position:relative;z-index:1}
.logo{font-weight:800;font-size:20px;background:var(--grad);
      -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.02em}
.tag{font-size:12px;color:var(--dim)}
.streak{margin-left:auto;display:flex;gap:16px;align-items:center;font-size:12.5px;color:var(--dim)}
.streak b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
.dot.on{background:var(--ok)} .dot.off{background:var(--bad)}

nav{display:flex;gap:6px;padding:12px 22px 0;background:var(--bg2);
    border-bottom:1px solid var(--line);overflow-x:auto;position:relative;z-index:1}
nav button{background:none;border:none;border-bottom:2px solid transparent;
  color:var(--dim);font:inherit;font-size:14px;font-weight:600;padding:9px 14px;
  cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
nav button:hover{color:var(--ink)}
nav button.active{color:var(--ink);border-bottom-color:var(--saffron)}
nav .badge{background:var(--saffron);color:#231400;border-radius:999px;
  font-size:10px;padding:1px 6px;font-weight:800}

main{flex:1;padding:22px 22px 40px;position:relative;z-index:1}
.wrap{max-width:800px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
      padding:24px;margin-bottom:16px}
h2{margin:0 0 4px;font-size:21px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:13.5px;margin:0 0 16px}

/* Jarvis Voice Visualizer & Controls */
.jarvis-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.voice-status{display:inline-flex;align-items:center;gap:10px;padding:6px 14px;border-radius:999px;
  background:rgba(255,255,255,0.04);border:1px solid var(--line);font-size:12.5px;font-weight:600}
.orb{width:14px;height:14px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok);transition:.3s}
.orb.speaking{background:var(--cyan);box-shadow:0 0 16px var(--cyan);animation:pulse-orb .8s infinite alternate}
.orb.listening{background:var(--bad);box-shadow:0 0 16px var(--bad);animation:pulse-orb .6s infinite alternate}
.orb.thinking{background:var(--de-gold);box-shadow:0 0 16px var(--de-gold);animation:pulse-orb .9s infinite alternate}
@keyframes pulse-orb{from{transform:scale(.85);opacity:.7}to{transform:scale(1.25);opacity:1}}

.voice-toggles{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.pill-btn{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:5px 11px;
  border-radius:8px;cursor:pointer;font:inherit;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.pill-btn.active{background:rgba(255,143,28,0.15);border-color:var(--saffron);color:var(--saffron)}

/* Interactive Tokens (Clickable German words) */
.tok{display:inline-block;cursor:pointer;padding:1px 3px;border-radius:4px;transition:.15s;position:relative}
.tok:hover{background:rgba(255,206,0,0.18);color:var(--de-gold);text-decoration:underline}

/* Word Card Popover */
.popover-card{position:fixed;bottom:24px;right:24px;max-width:340px;width:calc(100vw - 48px);background:var(--bg2);
  border:1px solid var(--saffron);border-radius:14px;padding:16px;box-shadow:0 12px 36px rgba(0,0,0,0.6);
  z-index:999;animation:slide-up .2s ease-out}
@keyframes slide-up{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.popover-card .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.popover-card .word{font-size:20px;font-weight:800;color:var(--ink)}
.popover-card .gender-tag{font-size:11px;text-transform:uppercase;padding:2px 7px;border-radius:6px;font-weight:700}
.popover-card .gender-tag.der{background:rgba(26,79,214,0.2);color:#5b8eff;border:1px solid #1a4fd6}
.popover-card .gender-tag.die{background:rgba(227,52,47,0.2);color:#ff7a75;border:1px solid #e3342f}
.popover-card .gender-tag.das{background:rgba(15,157,88,0.2);color:#3ddc97;border:1px solid #0f9d58}
.popover-card .trans{font-size:14.5px;color:var(--ink);margin:6px 0 10px;line-height:1.4}
.popover-card .parts{font-size:12.5px;color:var(--de-gold);font-family:'JetBrains Mono',monospace;margin-bottom:8px}
.popover-card .close-btn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:16px}

/* Chat Messages & Cards */
.chat{display:flex;flex-direction:column;gap:16px;min-height:300px;max-height:55vh;overflow-y:auto;padding-right:6px;margin-bottom:16px}
.msg{max-width:88%;padding:15px 18px;border-radius:16px;line-height:1.55}
.msg.jana{background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--grad);color:#1a1200;border-bottom-right-radius:4px;font-weight:600}
.msg .g{font-size:18px;font-weight:600;line-height:1.5}
.msg .t{font-size:13.5px;color:var(--dim);margin-top:7px;line-height:1.45}

.literal-box{margin-top:10px;padding:9px 12px;background:rgba(255,255,255,0.03);border:1px dashed var(--line);
  border-radius:9px;font-size:12.5px;color:var(--cyan);font-family:'JetBrains Mono',monospace;line-height:1.5}
.grammar-box{margin-top:10px;padding:9px 12px;background:rgba(255,206,0,0.06);border-left:3px solid var(--de-gold);
  border-radius:0 8px 8px 0;font-size:13px;color:var(--ink);line-height:1.45}
.correction-card{margin-top:12px;padding:12px 14px;background:rgba(255,107,107,0.08);border:1px solid rgba(255,107,107,0.3);
  border-radius:11px;font-size:13.5px}
.correction-card .diff{margin-bottom:6px;font-weight:600}
.correction-card .wrong-text{color:var(--bad);text-decoration:line-through;margin-right:8px}
.correction-card .right-text{color:var(--ok);font-weight:700}
.correction-card .rule{font-size:12.5px;color:var(--dim);margin-top:4px}

.msg-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.action-chip{background:none;border:1px solid var(--line);color:var(--dim);font:inherit;font-size:11.5px;
  font-weight:600;padding:3px 9px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:.12s}
.action-chip:hover{color:var(--ink);border-color:var(--saffron);background:rgba(255,143,28,0.08)}

.quick-replies{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.quick-chip{background:var(--bg2);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:13px;
  font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;transition:.15s}
.quick-chip:hover{border-color:var(--saffron);color:var(--saffron);transform:translateY(-1px)}

.prov{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.09em;border:1px solid var(--line);
  border-radius:999px;padding:3px 9px;color:var(--dim);font-weight:600}
.prov.human{border-color:var(--ok);color:var(--ok)}
.prov.model{border-color:var(--de-gold);color:var(--de-gold)}

.de{font-size:22px;line-height:1.5;font-weight:600}
.en{color:var(--dim);font-size:14.5px;margin-top:8px;line-height:1.5}
.newword{margin-top:12px;font-size:13px;color:var(--de-gold);
  border-left:2px solid var(--de-gold);padding-left:10px}

.btn{background:var(--grad);color:#1a1200;border:none;border-radius:11px;
  padding:12px 22px;font:inherit;font-weight:700;cursor:pointer;font-size:14.5px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn.rec{background:var(--de-red);color:#fff}
.btn.rec.live{animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.55}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}

input[type=text],textarea{width:100%;background:var(--bg);border:1px solid var(--line);
  border-radius:11px;padding:13px 15px;color:var(--ink);font:inherit;font-size:16px;outline:none}
textarea{min-height:150px;resize:vertical;line-height:1.6}
input:focus,textarea:focus{border-color:var(--saffron)}

.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;
  background:transparent;color:var(--ink);border:1px solid var(--line);
  border-radius:11px;padding:13px 15px;font:inherit;font-size:15.5px;cursor:pointer;
  margin-bottom:8px;transition:.12s}
.opt:hover:not(:disabled){border-color:var(--saffron);transform:translateX(3px)}
.opt:disabled{cursor:default;opacity:.6}
.opt .k{flex:none;width:23px;height:23px;border-radius:7px;border:1px solid var(--line);
  display:grid;place-items:center;font-size:11px;color:var(--dim);font-family:'JetBrains Mono',monospace}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);opacity:1}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent);opacity:1}

.verdict{margin-top:16px;font-size:15px;min-height:22px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:18px 0}
.score{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px}
.score .n{font-size:24px;font-weight:800}
.score .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em}
.fixlist{margin-top:14px;font-size:14px}
.fixlist li{margin-bottom:9px;line-height:1.5}
.fixlist .was{color:var(--bad);text-decoration:line-through}
.fixlist .now{color:var(--ok);font-weight:600}

.bar{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:20px}
.bar>i{display:block;height:100%;background:var(--grad);width:0;transition:width .35s}
.quip{margin-top:22px;font-size:12.5px;color:var(--dim);font-style:italic;text-align:center}
.empty{text-align:center;padding:34px 0}
.empty .big{font-size:38px;margin-bottom:10px}
kbd{font-family:'JetBrains Mono',monospace;font-size:10.5px;border:1px solid var(--line);
  border-radius:4px;padding:1px 5px;color:var(--dim)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
  border-top-color:var(--saffron);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.scene{background:linear-gradient(135deg,rgba(255,143,28,.13),rgba(26,79,214,.13));
  border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px}
.scene .day{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--saffron);font-weight:800}
.scene h3{margin:4px 0 6px;font-size:22px;font-weight:800}
.scene .where{color:var(--dim);font-size:13.5px}
.scene .who{margin-top:8px;font-size:13.5px}
.scene .who b{color:var(--ink)}
.turnbar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:14px}
.turnbar>i{display:block;height:100%;background:var(--grad);width:0;transition:width .4s}
.stage{display:flex;flex-direction:column;gap:14px;max-height:50vh;overflow-y:auto;
  padding:4px 6px 4px 0;margin-bottom:16px}
.line{max-width:88%;padding:12px 15px;border-radius:15px;line-height:1.5}
.line.npc{background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:5px}
.line.me{align-self:flex-end;background:linear-gradient(120deg,rgba(255,143,28,.22),rgba(15,157,88,.22));
  border:1px solid rgba(255,143,28,.4);border-bottom-right-radius:5px}
.line .who{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  font-weight:700;margin-bottom:5px}
.line .g{font-size:17px;font-weight:600}
.line .t{font-size:13px;color:var(--dim);margin-top:5px}
.line .said{font-size:12px;color:var(--dim);font-style:italic;margin-top:6px}
.line .tip{margin-top:7px;font-size:12.5px;color:var(--de-gold);border-left:2px solid var(--de-gold);padding-left:8px}
.modehint{font-size:12px;color:var(--dim);margin-top:8px;text-align:center}
.modehint b{color:var(--saffron)}
</style>
</head>
<body>

<header>
  <span class="logo">Jana</span>
  <span class="tag">AI German Instructor 🇮🇳→🇩🇪</span>
  <div class="streak">
    <span id="h-models"></span>
    <span>due <b id="h-due">–</b></span>
    <span>answers <b id="h-attempts">–</b></span>
    <span id="h-exam"></span>
  </div>
</header>

<nav>
  <button data-tab="story" class="active">📖 Die Geschichte <span class="badge">Tag 1</span></button>
  <button data-tab="chat">🎙️ Jana Instructor <span class="badge">Voice & Chat</span></button>
  <button data-tab="drill">⚡ Vokabeln</button>
  <button data-tab="lesen">📖 Lesen</button>
  <button data-tab="hoeren">🎧 Hören</button>
  <button data-tab="schreiben">✍️ Schreiben</button>
  <button data-tab="sprechen">🎤 Sprechen</button>
</nav>

<main><div class="wrap" id="view"></div></main>

<script>
const $=(s,r=document)=>r.querySelector(s);
const api=async(p,b)=>{const r=await fetch(p,b!==undefined?{method:"POST",
  headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}:{});
  if(!r.ok)throw new Error(await r.text());return r.json();};
const esc=s=>String(s??"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));

const QUIPS=[
 "Fun fact: German has a word for the weight you gain from emotional eating. Kummerspeck. You will need it in winter.",
 "In India you ask 'khana khaya?'. In Germany they ask 'Alles klar?' and do not want a real answer.",
 "The Bürgeramt appointment is booked three months out. Your German has three months. Coincidence? No.",
 "Chai has no German word. Kaffee has forty. Choose your fighter.",
 "German punctuality means the train is late and everyone is furious about it anyway.",
 "'Doch' has no English translation and that is the most German thing about it.",
 "You will learn 'Entschuldigung' before you learn 'hello'. This is correct and necessary.",
 "Every German noun has a gender and none of them make sense. Das Mädchen is neuter. Move on."
];
const quip=()=>QUIPS[Math.floor(Math.random()*QUIPS.length)];
const prov=p=>p==="remote"?'<span class="prov model">◆ deepseek</span>'
  :p==="local"?'<span class="prov model">◆ local model · validated</span>'
  :'<span class="prov human">● human-authored</span>';

let stats=null, tab="chat", chatHistory=[], sessionId=null;
let autoSpeak=true, speechRate=0.85, isListening=false, activePopover=null;

function setVoiceState(state, text=""){
  const orb=$("#v-orb"), status=$("#v-status");
  if(!orb||!status)return;
  orb.className="orb "+state;
  if(state==="speaking") status.textContent="Jana spricht…";
  else if(state==="listening") status.textContent="Jana hört zu… (sprich jetzt)";
  else if(state==="thinking") status.textContent="Jana denkt nach…";
  else status.textContent="Jana ist bereit";
}

function speakText(text, rate=speechRate){
  if(!text)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="de-DE"; u.rate=rate;
  const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith("de"));
  if(v)u.voice=v;
  u.onstart=()=>setVoiceState("speaking");
  u.onend=()=>setVoiceState("ready");
  u.onerror=()=>setVoiceState("ready");
  speechSynthesis.speak(u);
}

function renderGermanTokens(text){
  if(!text)return "";
  return text.split(/(\s+|[.,!?:;«»„"()]+)/).map(part=>{
    if(!part.trim()||/^[.,!?:;«»„"()]+$/.test(part)) return esc(part);
    const clean=part.replace(/[^\wÄÖÜäöüß-]/g,"");
    if(!clean) return esc(part);
    return `<span class="tok" onclick="openWordCard('${esc(clean)}')">${esc(part)}</span>`;
  }).join("");
}

async function openWordCard(word){
  closeWordCard();
  const card=document.createElement("div");
  card.className="popover-card";
  card.id="active-popover";
  card.innerHTML=`<div class="head">
    <span class="word">${esc(word)}</span>
    <button class="close-btn" onclick="closeWordCard()">✕</button>
  </div><div class="sub" style="margin:0"><span class="spin"></span> Looking up meaning…</div>`;
  document.body.appendChild(card);
  activePopover=card;

  try{
    const d=await api(`/api/lookup?word=${encodeURIComponent(word)}`);
    const gClass=d.gender?`gender-tag ${d.gender}`:'gender-tag';
    card.innerHTML=`<div class="head">
      <div>
        <span class="word">${esc(d.lemma||word)}</span>
        ${d.gender?`<span class="${gClass}">${d.gender}</span>`:""}
        <span class="prov model" style="font-size:10px;padding:2px 6px;margin-left:6px">${esc(d.pos||"")}</span>
      </div>
      <button class="close-btn" onclick="closeWordCard()">✕</button>
    </div>
    <div class="trans">${esc(d.en||"")}</div>
    ${d.note?`<div class="parts" style="color:var(--dim)">${esc(d.note)}</div>`:""}
    ${d.plural?`<div class="parts">Plural: <b>die ${esc(d.plural)}</b></div>`:""}
    ${d.principal_parts?`<div class="parts">Stammformen: <b>${esc(d.principal_parts)}</b></div>`:""}
    ${d.cefr?`<span class="badge" style="margin-top:4px">${d.cefr}</span>`:""}
    <div class="row" style="margin-top:10px">
      <button class="action-chip" onclick="speakText('${esc(d.lemma||word)}',0.8)">🔊 Anhören</button>
      <button class="action-chip" onclick="speakText('${esc(d.lemma||word)}',0.55)">🐢 Langsam</button>
    </div>`;
  }catch(e){
    card.innerHTML=`<div class="head"><span class="word">${esc(word)}</span>
      <button class="close-btn" onclick="closeWordCard()">✕</button></div>
      <div class="trans">${esc(word)}</div>
      <button class="action-chip" onclick="speakText('${esc(word)}',0.8)">🔊 Anhören</button>`;
  }
}

function closeWordCard(){
  const c=$("#active-popover");
  if(c){c.remove();activePopover=null;}
}
document.addEventListener("click",e=>{
  if(activePopover&&!activePopover.contains(e.target)&&!e.target.classList.contains("tok")){
    closeWordCard();
  }
});

async function explainSentence(text, btn){
  const box=btn.closest(".msg").querySelector(".deep-explain-box");
  if(box.style.display==="block"){box.style.display="none";return;}
  box.style.display="block";
  box.innerHTML=`<span class="spin"></span> Analysing grammar structure…`;
  try{
    const r=await api("/api/explain",{text:text});
    box.innerHTML=`<div style="font-size:13px;font-weight:700;color:var(--saffron);margin-bottom:6px">💡 Grammatik-Analyse:</div>
      <div style="font-size:12.5px;color:var(--cyan);font-family:'JetBrains Mono',monospace;margin-bottom:6px">🔤 ${esc(r.literal)}</div>
      <div style="font-size:13px;line-height:1.45">${esc(r.grammar_breakdown)}</div>
      ${r.key_rule?`<div style="font-size:12px;color:var(--de-gold);margin-top:6px">📌 Regel: ${esc(r.key_rule)}</div>`:""}`;
  }catch(e){
    box.innerHTML=`<span style="color:var(--bad)">Analysis unavailable.</span>`;
  }
}

/* ------------------------------------------------------------------ Gespräch (Jarvis AI) */
function viewChat(){
  $("#view").innerHTML=`<div class="card">
    <div class="jarvis-header">
      <div class="voice-status">
        <span class="orb" id="v-orb"></span>
        <span id="v-status">Jana ist bereit</span>
      </div>
      <div class="voice-toggles">
        <button class="pill-btn ${autoSpeak?'active':''}" id="t-voice">🔊 Auto-Voice: ${autoSpeak?'ON':'OFF'}</button>
        <button class="pill-btn" id="t-speed">⚡ Tempo: ${speechRate}x</button>
      </div>
    </div>
    <h2>Jana — AI German Instructor</h2>
    <p class="sub">Speak or type in German. Jana corrects your grammar, breaks down sentences word-for-word, and adapts to your progress.</p>
    <div class="chat" id="chat"></div>
    <div class="quick-replies" id="quick-replies"></div>
    <div class="row" style="margin:0">
      <button class="btn rec" id="mic-btn" style="flex:none;padding:12px 18px" title="Speak in German">🎤</button>
      <input type="text" id="say" placeholder="Sprich oder schreibe auf Deutsch… (oder auf Englisch)" autocomplete="off" style="flex:1">
      <button class="btn" id="send">Senden</button>
    </div>
    <p class="quip">${quip()}</p></div>`;

  $("#send").onclick=()=>send();
  $("#say").onkeydown=e=>{if(e.key==="Enter")send();};
  $("#t-voice").onclick=()=>{autoSpeak=!autoSpeak;$("#t-voice").className="pill-btn "+(autoSpeak?"active":"");$("#t-voice").textContent="🔊 Auto-Voice: "+(autoSpeak?"ON":"OFF");};
  $("#t-speed").onclick=()=>{speechRate=speechRate===0.85?0.6:speechRate===0.6?1.0:0.85;$("#t-speed").textContent="⚡ Tempo: "+speechRate+"x";};

  initMic();
  if(!chatHistory.length) send(true);
  else redrawChat();
}

function initMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const micBtn=$("#mic-btn");
  if(!SR||!micBtn)return;
  const rec=new SR();
  rec.lang="de-DE"; rec.interimResults=true; rec.continuous=false;

  micBtn.onclick=()=>{
    if(isListening){rec.stop();return;}
    try{rec.start();}catch(e){}
  };
  rec.onstart=()=>{
    isListening=true;
    micBtn.classList.add("live");
    micBtn.textContent="⏹";
    setVoiceState("listening");
  };
  rec.onend=()=>{
    isListening=false;
    micBtn.classList.remove("live");
    micBtn.textContent="🎤";
    setVoiceState("ready");
    const val=$("#say").value.trim();
    if(val.length>=2) send();
  };
  rec.onerror=()=>{
    isListening=false;
    micBtn.classList.remove("live");
    micBtn.textContent="🎤";
    setVoiceState("ready");
  };
  rec.onresult=e=>{
    const transcript=Array.from(e.results).map(r=>r[0].transcript).join(" ");
    $("#say").value=transcript;
  };
}

function bubble(html,cls){
  const d=document.createElement("div");
  d.className="msg "+cls; d.innerHTML=html;
  $("#chat").appendChild(d);
  $("#chat").scrollTop=1e6;
  return d;
}

function redrawChat(){
  $("#chat").innerHTML="";
  chatHistory.forEach(m=>m.role==="user"?bubble(esc(m.content),"me"):bubble(m.html||esc(m.content),"jana"));
}

function setQuickReplies(chips){
  const box=$("#quick-replies");
  if(!box)return;
  if(!chips||!chips.length){box.innerHTML="";return;}
  box.innerHTML=chips.map(c=>`<button class="quick-chip" onclick="useQuickReply('${esc(c).replace(/'/g,"\\'")}')">💬 ${esc(c)}</button>`).join("");
}

function useQuickReply(text){
  const inp=$("#say");
  if(inp){inp.value=text;send();}
}

async function send(opening){
  const box=$("#say"); const text=opening===true?"":box.value.trim();
  if(!opening&&!text)return;
  if(text){chatHistory.push({role:"user",content:text});bubble(esc(text),"me");box.value="";}
  setVoiceState("thinking");
  const think=bubble('<span class="typing">Jana denkt nach… <span class="spin"></span></span>',"jana");
  setQuickReplies([]);

  try{
    const t=await api("/api/chat",{message:text,history:chatHistory
      .filter(m=>m.role==="user"||m.role==="assistant")
      .map(m=>({role:m.role,content:m.content})),session_id:sessionId});

    let correctionHtml="";
    if(t.correction){
      correctionHtml=`<div class="correction-card">
        <div class="diff">✎ <b>Korrektur / Instructor Feedback:</b></div>
        <div>${esc(t.correction)}</div>
      </div>`;
    }

    let literalHtml=t.literal_en?`<div class="literal-box">🔤 <b>Wörtlich (Literal):</b> ${esc(t.literal_en)}</div>`:"";
    let grammarHtml=t.grammar_tip?`<div class="grammar-box">💡 <b>Grammatik-Tipp:</b> ${esc(t.grammar_tip)}</div>`:"";

    const deFormatted=renderGermanTokens(t.de);
    const escapedDe=JSON.stringify(t.de||"").replace(/"/g,"&quot;");

    const html=`
      <div class="g">${deFormatted}</div>
      <div class="t">🇬🇧 ${esc(t.en)}</div>
      ${literalHtml}
      ${grammarHtml}
      ${correctionHtml}
      ${t.targets_used?.length?`<div class="used">✓ Counted as vocabulary review: ${t.targets_used.map(esc).join(", ")}</div>`:""}
      ${t.new_words?.length?`<div class="newword">new word: ${t.new_words.map(esc).join(", ")}</div>`:""}
      <div class="msg-actions">
        <button class="action-chip" onclick="speakText(${escapedDe},0.85)">🔊 Anhören</button>
        <button class="action-chip" onclick="speakText(${escapedDe},0.6)">🐢 Langsam</button>
        <button class="action-chip" onclick="explainSentence(${escapedDe},this)">💡 Satz-Analyse</button>
      </div>
      <div class="deep-explain-box grammar-box" style="display:none;margin-top:10px"></div>
      <div style="margin-top:10px">${prov(t.provenance)}</div>`;

    if(t.session_id)sessionId=t.session_id;
    think.innerHTML=html;
    chatHistory.push({role:"assistant",content:t.de+" — "+t.en,html});
    setVoiceState("ready");
    setQuickReplies(t.quick_replies||[]);

    if(autoSpeak&&t.de){
      setTimeout(()=>speakText(t.de, speechRate), 300);
    }
    refreshStats();
  }catch(e){
    setVoiceState("ready");
    think.innerHTML='<span class="typing" style="color:var(--bad)">Jana is offline. Is ollama running?</span>';
  }
}

/* ------------------------------------------------------------------- Story */
let storyDay=null;

function storyLine(t){
  const mine=t.speaker==="learner";
  const who=mine?"Du":(storyDay?storyDay.npc:"");
  return `<div class="line ${mine?"me":"npc"}">
    <div class="who">${esc(who)}</div>
    <div class="g">${renderGermanTokens(t.de)}</div>
    ${t.en&&!mine?`<div class="t">${esc(t.en)}</div>`:""}
    ${mine&&t.input_lang==="en"?`<div class="said">you said: “${esc(t.learner_input)}”</div>`:""}
    ${t.correction?`<div class="tip">✎ ${esc(t.correction)}</div>`:""}

}

async function viewStory(){

async function storySay(){
  const box=$("#say-story"), text=box.value.trim();
  if(!text)return;
  box.value=""; box.disabled=true; $("#send-story").disabled=true;
  const stage=$("#stage");
  stage.insertAdjacentHTML("beforeend",
    `<div class="line me"><div class="who">Du</div><div class="g">${esc(text)}</div>
     <div class="said"><span class="spin"></span> auf Deutsch…</div></div>`);
  stage.scrollTop=1e6;
  try{
    const r=await api("/api/story/say",{text,session_id:sessionId,day:storyDay.day_number});
    stage.lastElementChild.remove();
    stage.insertAdjacentHTML("beforeend", storyLine(r.learner));
    stage.insertAdjacentHTML("beforeend", storyLine(r.npc));
    stage.scrollTop=1e6;
    storyDay.turns_used=r.turns_used; storyDay.complete=r.complete;
    const bar=document.querySelector(".turnbar>i");
    if(bar)bar.style.width=Math.min(100,(r.turns_used/r.turns_target)*100)+"%";
    if(autoSpeak)speakText(r.npc.de);
    refreshStats();
  }catch(e){
    stage.lastElementChild.remove();
    stage.insertAdjacentHTML("beforeend",
      `<div class="line npc"><div class="g">…</div><div class="t">Connection failed.</div></div>`);
  }
  box.disabled=false; $("#send-story").disabled=false; box.focus();
}

/* --------------------------------------------------------------------- Drill */
let drill=null,locked=false,pending=null;
async function viewDrill(){
  $("#view").innerHTML=`<div class="card"><div class="empty"><span class="spin"></span></div></div>`;
  try{drill=await api("/api/state"); if(!drill.question)drill=await api("/api/session",{});}
  catch(e){drill={question:null};}
  renderDrill();
}
function renderDrill(){
  if(!drill||!drill.question){
    $("#view").innerHTML=`<div class="card"><div class="empty">
      <div class="big">🎉</div><h2>Nichts mehr fällig</h2>
      <p class="sub">Everything scheduled is in the future. Go talk to Jana instead.</p>
      <button class="btn" onclick="go('chat')">Zum Gespräch</button></div></div>`;return;}
  const q=drill.question,p=drill.progress,total=p.asked+p.remaining;
  $("#view").innerHTML=`<div class="card">
    <div class="bar"><i style="width:${total?p.asked/total*100:0}%"></i></div>
    <p class="sub" style="margin:0 0 14px">${q.task_type.replace("_"," ")} · rung ${q.rung} · ${p.remaining} left</p>
    <div class="de">${renderGermanTokens(q.prompt).replace("___",'<span style="color:var(--saffron)">___</span>')}</div>
    ${q.hint?`<div class="en" style="font-family:'JetBrains Mono',monospace;letter-spacing:.1em">${esc(q.hint)}</div>`:""}
    <div style="margin-top:20px">${q.options?q.options.map((o,i)=>
      `<button class="opt" data-v="${encodeURIComponent(o)}"><span class="k">${i+1}</span><span>${esc(o)}</span></button>`).join("")
      :`<input type="text" id="typed" placeholder="type the German…" autocomplete="off" autocorrect="off" spellcheck="false">`}</div>
    <div class="verdict" id="dv"></div></div>`;
  locked=false;pending=null;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerDrill(decodeURIComponent(b.dataset.v),b));
  const t=$("#typed"); if(t){t.focus();t.onkeydown=e=>{if(e.key!=="Enter")return;
    e.preventDefault(); locked?nextDrill():answerDrill(t.value,null);};}
}
async function answerDrill(resp,btn){
  if(locked)return;locked=true;
  const n=await api("/api/answer",{session_id:drill.session_id,item_id:drill.question.item_id,
    response:resp,latency_ms:900});
  const o=n.outcome,v=$("#dv");
  v.className="verdict "+(o.correct?"ok":"no");
  v.innerHTML=(o.correct?"✓ richtig":`✗ falsch — ${esc(o.expected)}`)
    +(o.note?` <span style="color:var(--de-gold);font-size:13px">${esc(o.note)}</span>`:"")
    +` <span style="float:right;color:var(--dim);font-size:12px"><kbd>enter</kbd> weiter</span>`;
  if(btn){document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;
    if(decodeURIComponent(b.dataset.v)===o.expected)b.classList.add("correct");});
    if(!o.correct)btn.classList.add("wrong");}
  pending=n;refreshStats();
}
function nextDrill(){if(pending){drill=pending;pending=null;renderDrill();}}
document.addEventListener("keydown",e=>{
  if(tab!=="drill")return;
  if(locked&&["Enter"," "].includes(e.key)){e.preventDefault();nextDrill();return;}
  if(e.target.tagName==="INPUT"||!drill?.question?.options||locked)return;
  const n=+e.key; if(n>=1&&n<=drill.question.options.length)document.querySelectorAll(".opt")[n-1].click();
});

    const r=await api("/api/lesen/answer",{response:ans,reference:ref,item_ids:m.item_ids,session_id:sessionId});

  const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith("de"));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}

      const v=card.querySelector(".verdict");v.className="verdict "+(r.correct?"ok":"no");
      v.textContent=r.correct?"✓ richtig":"✗ falsch";refreshStats();});
    setTimeout(()=>speak(hoerenMat.text),350);
  }
}

/* ----------------------------------------------------------------- Schreiben */
let schreibenTeil=null;
async function viewSchreiben(){
  const tb=`<div style="display:flex;gap:8px;margin-bottom:16px">${[1,2,3].map(t=>
    `<button class="btn ${schreibenTeil===t||(schreibenTeil===null&&t===1)?'':'ghost'}" data-st="${t}">Teil ${t}</button>`).join("")}</div>`;
  const teil=schreibenTeil||1;
  const desc=['','Teil 1 — Informelle E-Mail (40+ Wörter)','Teil 2 — Meinungsäußerung im Forum (40+ Wörter)','Teil 3 — Formeller Brief / E-Mail (40+ Wörter)'][teil];
  const placeh=['','Liebe/Lieber …, / Hallo …,','Ich bin der Meinung, dass …','Sehr geehrte Damen und Herren, / Sehr geehrte(r) Frau/Herr …'][teil];
  
  $("#view").innerHTML=`<div class="card">
    <h2>✍️ Schreiben</h2>
    <p class="sub">${desc}</p>
    ${tb}
    <div class="empty"><span class="spin"></span> Loading prompt…</div></div>`;
  document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{schreibenTeil=+b.dataset.st;viewSchreiben();});

  const t=await api(`/api/schreiben?teil=${teil}`);
  $("#view").innerHTML=`<div class="card">
    <h2>✍️ Schreiben — Teil ${t.teil||teil}</h2>
    <p class="sub">${desc}. Graded on the four official Goethe B1 criteria.</p>
    ${tb}
    <div class="de" style="font-size:18px">${esc(t.task)}</div>
    <div class="en">${esc(t.en)}</div>
    <textarea id="essay" placeholder="${esc(placeh)}"></textarea>
    <div class="row"><button class="btn" id="grade">Bewerten</button>
      <span class="sub" style="margin:0" id="wc">0 words</span></div>
    <div id="result"></div>
    <p class="quip">${quip()}</p></div>`;
  document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{schreibenTeil=+b.dataset.st;viewSchreiben();});

  const ta=$("#essay");
  ta.oninput=()=>$("#wc").textContent=`${ta.value.trim().split(/\s+/).filter(Boolean).length} words`;
  $("#grade").onclick=async()=>{
    if(ta.value.trim().length<15){$("#result").innerHTML=`<div class="verdict no">Write a bit more first.</div>`;return;}
    $("#grade").disabled=true;
    $("#result").innerHTML=`<div class="row"><span class="spin"></span>
      <span class="sub" style="margin:0">Grading against the Goethe rubric…</span></div>`;
    const r=await api("/api/schreiben/grade",{response:ta.value,teil:t.teil||teil});
    $("#grade").disabled=false;
    if(r.error){$("#result").innerHTML=`<div class="verdict no">${esc(r.error)}</div>`;return;}
    $("#result").innerHTML=`
      <div class="scores">
        ${[["erfuellung","Task"],["kohaerenz","Coherence"],["wortschatz","Vocabulary"],["strukturen","Grammar"]]
          .map(([k,l])=>`<div class="score"><div class="n">${r[k]??0}<span style="font-size:13px;color:var(--dim)">/5</span></div><div class="l">${l}</div></div>`).join("")}
        <div class="score" style="border-color:var(--saffron)"><div class="n">${r.total}<span style="font-size:13px;color:var(--dim)">/20</span></div><div class="l">Total</div></div>
      </div>
      <div class="en" style="font-size:14.5px">${esc(r.feedback||"")}</div>
      ${(r.corrections||[]).length?`<ul class="fixlist">${r.corrections.map(c=>
        `<li><span class="was">${esc(c.was)}</span> → <span class="now">${esc(c.should_be)}</span><br>
         <span class="sub" style="margin:0">${esc(c.why)}</span></li>`).join("")}</ul>`:""}
      ${r.better_version?`<div class="card" style="margin-top:16px;background:var(--bg)">
        <div class="l" style="font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Your text, corrected</div>
        <div class="de" style="font-size:16px">${esc(r.better_version)}</div></div>`:""}
      <div style="margin-top:12px">${prov(r.tier)}</div>`;
    refreshStats();};
}

/* ------------------------------------------------------------------ Sprechen */
let sprechenTeil=null;
async function viewSprechen(){
  const tb=`<div style="display:flex;gap:8px;margin-bottom:16px">${[1,2,3].map(t=>
    `<button class="btn ${sprechenTeil===t||(sprechenTeil===null&&t===1)?'':'ghost'}" data-spt="${t}">Teil ${t}</button>`).join("")}</div>`;
  const teil=sprechenTeil||1;
  const desc=['','Teil 1 — Gemeinsam etwas planen','Teil 2 — Ein Thema präsentieren','Teil 3 — Auf Fragen reagieren / Gespräch'][teil];

  $("#view").innerHTML=`<div class="card">
    <h2>🎤 Sprechen</h2>
    <p class="sub">${desc}</p>
    ${tb}
    <div class="empty"><span class="spin"></span> Loading prompt…</div></div>`;
  document.querySelectorAll("[data-spt]").forEach(b=>b.onclick=()=>{sprechenTeil=+b.dataset.spt;viewSprechen();});

  const res=await api(`/api/sprechen?teil=${teil}`);
  const tTeil=res.teil||teil;
  let dePrompt="", enPrompt="", detailsHtml="", promptForGrading="";

  if(tTeil===1){
    const d=res.data||{};
    dePrompt=d.scenario||"";
    enPrompt=d.en||"";
    const pts=d.points||[];
    promptForGrading=`Planung: ${dePrompt} Punkte: ${pts.join(", ")}`;
    detailsHtml=`<div style="margin-top:14px">
      <div class="l" style="font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Sprechen Sie über diese Punkte:</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">${pts.map(p=>`<span class="prov model" style="font-size:13px;padding:4px 10px">${esc(p)}</span>`).join("")}</div>
    </div>`;
  } else if(tTeil===2){
    const d=res.data||{};
    dePrompt=`Präsentationsthema: ${d.topic||""}`;
    enPrompt=d.en||"";
    const kws=d.keywords||[];
    promptForGrading=`Präsentation: ${d.topic||""}. Aspekte: ${kws.join(", ")}`;
    detailsHtml=`<div style="margin-top:14px">
      <div class="l" style="font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Gliedern Sie Ihre Präsentation:</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">${kws.map(k=>`<span class="prov model" style="font-size:13px;padding:4px 10px">${esc(k)}</span>`).join("")}</div>
    </div>`;
  } else {
    const d=res.data||res;
    dePrompt=d.prompt||"";
    enPrompt=d.en||"";
    promptForGrading=dePrompt;
  }

  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  $("#view").innerHTML=`<div class="card">
    <h2>🎤 Sprechen — Teil ${tTeil}</h2>
    <p class="sub">${desc}. Answer out loud in German.</p>
    ${tb}
    <div class="de" style="font-size:19px">${esc(dePrompt)}</div>
    <div class="en">${esc(enPrompt)}</div>
    ${detailsHtml}
    <div class="row"><button class="btn ghost" id="hear">🔊 Vorlesen</button></div>
    ${SR?`<div class="row"><button class="btn rec" id="rec">🎤 Aufnehmen</button>
       <span class="sub" style="margin:0" id="status"></span></div>
     <input type="text" id="said" placeholder="…or type your answer" style="margin-top:14px" autocomplete="off">
     <div class="row"><button class="btn" id="grade">Bewerten</button></div>`
    :`<div class="newword">This browser has no speech recognition. Chrome supports it.
       You can still type your answer below.</div>
      <input type="text" id="said" placeholder="type your answer" style="margin-top:14px">
      <div class="row"><button class="btn" id="grade">Bewerten</button></div>`}
    <div id="sresult"></div><p class="quip">${quip()}</p></div>`;
  document.querySelectorAll("[data-spt]").forEach(b=>b.onclick=()=>{sprechenTeil=+b.dataset.spt;viewSprechen();});

  $("#hear").onclick=()=>speak(dePrompt);
  if(SR){
    const rec=new SR();rec.lang="de-DE";rec.interimResults=true;rec.continuous=false;
    let live=false;
    $("#rec").onclick=()=>{if(live){rec.stop();return;}
      try{rec.start();}catch(e){}};
    rec.onstart=()=>{live=true;$("#rec").classList.add("live");$("#rec").textContent="⏹ Stop";
      $("#status").textContent="listening…";};
    rec.onend=()=>{live=false;$("#rec").classList.remove("live");$("#rec").textContent="🎤 Aufnehmen";
      $("#status").textContent="";};
    rec.onerror=e=>{$("#status").textContent="mic error: "+e.error;};
    rec.onresult=e=>{$("#said").value=Array.from(e.results).map(r=>r[0].transcript).join(" ");};
  }
  $("#grade").onclick=async()=>{
    const said=$("#said").value.trim();
    if(!said){$("#sresult").innerHTML=`<div class="verdict no">Say or type something first.</div>`;return;}
    $("#grade").disabled=true;
    $("#sresult").innerHTML=`<div class="row"><span class="spin"></span><span class="sub" style="margin:0">Listening back…</span></div>`;
    const r=await api("/api/sprechen/grade",{response:said,prompt:promptForGrading,teil:tTeil});
    $("#grade").disabled=false;
    if(r.error){$("#sresult").innerHTML=`<div class="verdict no">${esc(r.error)}</div>`;return;}
    $("#sresult").innerHTML=`
      <div class="scores"><div class="score" style="border-color:var(--saffron)">
        <div class="n">${r.score??0}<span style="font-size:13px;color:var(--dim)">/${r.max??10}</span></div>
        <div class="l">Score</div></div></div>
      <div class="en" style="color:var(--ok);font-size:14.5px">✓ ${esc(r.good||"")}</div>
      <div class="en" style="color:var(--de-gold);font-size:14.5px">✎ ${esc(r.fix||"")}</div>
      ${r.model_answer?`<div class="card" style="margin-top:14px;background:var(--bg)">
        <div style="font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">One good answer</div>
        <div class="de" style="font-size:17px">${esc(r.model_answer)}</div>
        <button class="btn ghost" style="margin-top:12px" onclick="speak(${JSON.stringify(r.model_answer||"").replace(/"/g,"&quot;")})">🔊 Hear it</button>
        </div>`:""}
      <div style="margin-top:12px">${prov(r.tier)}</div>`;
    refreshStats();};
}

/* ---------------------------------------------------------------- routing */
// Header counters and model health. Called after every action that can change
// state, and on a slow timer so a background gloss run or another tab shows up.
// Deliberately never throws: a failed stats poll must not take the app down —
// which it did, because the bootstrap awaited a function that did not exist and
// every view stopped rendering.
async function refreshStats(){
  try{
    const s=await api("/api/state");
    if(s.session_id)sessionId=s.session_id;
    const st=s.stats;
    if(st){
      $("#h-due").textContent=st.due;
      $("#h-attempts").textContent=(st.attempts||0).toLocaleString();
      const days=Math.ceil((new Date(st.exam_date+"T09:00:00")-Date.now())/864e5);
      $("#h-exam").innerHTML=`<b>${days}</b> days to B1`;
    }
  }catch(e){}
  try{
    const h=await api("/api/health");
    $("#h-models").innerHTML=
      `<span class="dot ${h.ollama?"on":"off"}"></span>local`+
      `<span style="margin-left:12px"></span>`+
      `<span class="dot ${h.deepseek?"on":"off"}"></span>deepseek`;
  }catch(e){}
}

const VIEWS={story:viewStory,chat:viewChat,drill:viewDrill,lesen:viewLesen,hoeren:viewHoeren,
             schreiben:viewSchreiben,sprechen:viewSprechen};
function go(name){
  tab=name;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));
  VIEWS[name]();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
speechSynthesis.getVoices();
speechSynthesis.onvoiceschanged=()=>{};
// Render first, then poll. The view must not wait on the network to appear.
go("story");
refreshStats();
setInterval(refreshStats,20000);
</script>
